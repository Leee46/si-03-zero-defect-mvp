<!DOCTYPE html>
<html>
<head>
    <title>SI-03 Zero-Defect Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Zero-Defect Manufacturing System</h1>
    <div id="dashboard">
        <div class="card">
            <h3>Defect Detection</h3>
            <button onclick="detect()">Detect Defect</button>
            <p id="result">No detection yet.</p>
        </div>
        <div class="card">
            <h3>Probable Causes</h3>
            <p id="causes">Loading...</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
